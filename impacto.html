<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<title>Meu impacto · Validade Inteligente</title>
</head>
<body data-pagina="impacto">
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<main class="principal" id="conteudo">
  <header class="cabecalho topo"><button class="botao-icone" type="button" data-voltar data-alternativa="index.html" aria-label="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><div><h1>Meu impacto</h1><p class="texto-suave" id="subtitulo">Só alimentos, sem valores em dinheiro</p></div></header>
  <div class="colunas">
    <section class="destaque situacao-seguro destaque-bloco" aria-labelledby="titulo-aproveitados">
      <p class="destaque-rotulo">Alimentos aproveitados</p>
      <h2 class="numero-grande" id="titulo-aproveitados"><span id="aproveitados">0 de 0</span></h2>
      <p class="texto-suave" id="mensagem"></p>
      <div class="barra-progresso" role="img" aria-label="Percentual de alimentos aproveitados"><span id="preenchimento"></span></div>
      <p class="meta-texto">Meta do projeto: reduzir o desperdício de alimentos em 25%.</p>
      <button class="botao botao-contorno botao-pequeno afastar-topo" type="button" id="botao-exemplo" hidden>Carregar histórico de exemplo</button>
    </section>
    <section aria-label="Números">
      <div class="grade-numeros">
        <div class="resumo situacao-seguro"><strong id="total-consumidos">0</strong><span>consumidos</span></div>
        <div class="resumo situacao-vencido"><strong id="total-descartados">0</strong><span>descartados</span></div>
      </div>
      <div class="cartao"><h2 class="titulo-cartao">Descartados por semana</h2><div class="grafico" id="grafico" role="img" aria-label="Gráfico de alimentos descartados por semana"></div></div>
    </section>
  </div>
  <section class="afastar-topo-grande"><h2>Histórico recente</h2><ul class="pilha" id="recentes"></ul></section>
</main>
<script src="js/nucleo.js"></script><script src="js/impacto.js"></script>
</body>
</html>
