<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Criar conta · Validade Inteligente</title>
</head>
<body>
<main class="auth" id="conteudo">
  <div style="width:100%;max-width:440px">
    <div class="auth-top"><button class="icon-btn" type="button" data-voltar data-fallback="index.html" aria-label="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><a class="brand" href="index.html"><span class="logo" aria-hidden="true">V</span>Validade Inteligente</a></div>
    <form class="card" novalidate>
      <h1>Crie sua conta</h1><p class="muted sub">Leva menos de 1 minuto.</p>
      <div class="field"><label for="nome">Nome</label><input id="nome" name="nome" type="text" placeholder="Como podemos te chamar?" aria-describedby="e-nome" autocomplete="name"><span class="err" id="e-nome" role="alert"></span></div>
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="voce@email.com" aria-describedby="e-email" autocomplete="email"><span class="err" id="e-email" role="alert"></span></div>
      <div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" aria-describedby="e-senha"><div class="forca" id="forca" data-n="0" aria-hidden="true"><i></i><i></i><i></i></div><span class="err" id="e-senha" role="alert"></span></div>
      <div class="field"><label for="confirma">Confirmar senha</label><input id="confirma" name="confirma" type="password" placeholder="Repita a senha" aria-describedby="e-confirma" autocomplete="new-password"><span class="err" id="e-confirma" role="alert"></span></div>
      <div class="field"><label class="check" for="termos"><input id="termos" name="termos" type="checkbox" aria-describedby="e-termos"><span>Li e aceito os Termos de uso e a Política de Privacidade.</span></label><span class="err" id="e-termos" role="alert"></span></div>
      <button class="btn primary" type="submit" style="width:100%">Criar conta</button>
      <p class="links">Já tenho conta. <a href="login.html">Entrar</a></p>
    </form>
  </div>
</main>
<script src="js/auth.js"></script>
<script src="js/transicao.js"></script>
</body>
</html>
