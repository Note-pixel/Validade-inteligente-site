<meta name="viewport" content="width=device-width, initial-scale=1">

<body data-page="cadastrar">

<aside class="side"><a class="brand" href="index.html"><span class="logo" aria-hidden="true">V</span>Validade Inteligente</a><nav aria-label="Principal"><a href="inicio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Início</span></a><a href="despensa.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>Despensa</span></a><a href="alertas.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg><span>Alertas</span></a></nav><a class="btn primary" href="cadastrar.html">Adicionar alimento</a></aside>
<nav class="tabbar" aria-label="Navegação"><a href="inicio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Início</span></a><a class="fab" href="cadastrar.html" aria-label="Adicionar alimento"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a><a href="despensa.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>Despensa</span></a><a href="alertas.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg><span>Alertas</span></a></nav>
<main class="main" id="conteudo">
  <header class="head topo"><button class="icon-btn" type="button" data-voltar data-fallback="inicio.html" aria-label="Fechar e voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div><h1>Adicionar alimento</h1><p class="muted" id="total"></p></div></header>
  <div class="form-wrap">
    <form class="card" id="form-alimento" novalidate>
      <div class="field"><label for="nome">Nome do alimento</label><input id="nome" name="nome" type="text" placeholder="Ex.: Leite integral" autocomplete="off" aria-describedby="e-nome"><span class="err" id="e-nome" role="alert"></span></div>
      <div class="two">
        <div class="field"><label for="validade">Validade</label><input id="validade" name="validade" type="date" aria-describedby="e-validade"><span class="err" id="e-validade" role="alert"></span></div>
        <div class="field"><label for="qtd">Quantidade</label><input id="qtd" name="qtd" type="text" placeholder="Ex.: 2 unidades" autocomplete="off"></div>
      </div>
      <div class="field"><label for="local">Onde você guarda?</label><select id="local" name="local"><option>Geladeira</option><option>Armário</option><option>Freezer</option></select></div>
      <button class="btn primary" type="submit" style="width:100%">Salvar alimento</button>
    </form>
    <aside aria-label="Prévia do alimento">
      <h2>Como vai aparecer</h2>
      <ul class="stack" id="previa"></ul>
      <p class="dica">Confira a data na embalagem antes de salvar. Vamos avisar quando o alimento estiver perto de vencer.</p>
    </aside>
  </div>
</main>
</div>
<script src="js/app.js"></script><script src="js/cadastrar.js"></script>
<script src="js/transicao.js"></script>
