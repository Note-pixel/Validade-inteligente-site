<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<title>Adicionar alimento · Validade Inteligente</title>
</head>
<body data-pagina="cadastrar">
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<main class="principal" id="conteudo">
  <header class="cabecalho topo"><button class="botao-icone" type="button" data-voltar data-alternativa="index.html" aria-label="Fechar e voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div><h1 id="titulo-pagina">Adicionar alimento</h1><p class="texto-suave" id="total"></p></div></header>
  <p class="acoes-linha afastar-baixo"><a class="botao botao-contorno botao-pequeno" href="escanear.html">Ler código de barras ou QR Code</a><a class="botao botao-contorno botao-pequeno" href="alexa.html">Falar com a Alexa</a></p>
  <p class="dica dica-solta" id="origem" hidden></p>
  <div class="formulario-pagina">
    <form class="cartao" id="formulario-alimento" novalidate>
      <div class="campo"><label for="nome">Nome do alimento</label><input id="nome" name="nome" type="text" placeholder="Ex.: Leite integral" autocomplete="off" aria-describedby="erro-nome"><span class="erro" id="erro-nome" role="alert"></span></div>
      <div class="duas-colunas">
        <div class="campo"><label for="validade">Validade</label><input id="validade" name="validade" type="date" aria-describedby="erro-validade"><span class="erro" id="erro-validade" role="alert"></span></div>
        <div class="campo"><label for="quantidade">Quantidade</label><input id="quantidade" name="quantidade" type="text" placeholder="Ex.: 2 unidades" autocomplete="off"></div>
      </div>
      <div class="campo"><label for="local">Onde você guarda?</label><select id="local" name="local"><option>Geladeira</option><option>Armário</option><option>Freezer</option></select></div>
      <button class="botao botao-primario largura-total" type="submit" id="botao-salvar">Salvar alimento</button>
    </form>
    <aside aria-label="Prévia do alimento">
      <h2>Como vai aparecer</h2>
      <ul class="pilha" id="previa"></ul>
      <p class="dica">Confira a data na embalagem antes de salvar. Vamos avisar quando o alimento estiver perto de vencer.</p>
    </aside>
  </div>
</main>
<script src="js/nucleo.js"></script><script src="js/cadastrar.js"></script>
</body>
</html>
