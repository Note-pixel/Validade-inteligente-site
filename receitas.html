<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<title>Receitas · Validade Inteligente</title>
</head>
<body data-pagina="receitas">
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<main class="principal" id="conteudo">
  <header class="cabecalho topo"><button class="botao-icone" type="button" data-voltar data-alternativa="index.html" aria-label="Voltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><div><h1>Receitas</h1><p class="texto-suave" id="subtitulo"></p></div></header>
  <form id="formulario-receitas" class="cartao" novalidate>
    <h2>Escolha os ingredientes</h2>
    <p class="texto-suave texto-sob-titulo">Começamos pelos que vencem logo. Marque ou desmarque à vontade.</p>
    <div class="escolhas" id="ingredientes" role="group" aria-label="Ingredientes da despensa"></div>
    <p class="erro" id="erro-ingredientes" role="alert"></p>
    <div class="acoes-linha"><button class="botao botao-primario" type="submit">Gerar receitas</button><button class="botao botao-contorno" type="button" id="botao-ia">Gerar com IA</button></div>
  </form>
  <section class="afastar-topo-grande" aria-live="polite"><div id="resultado" class="pilha"></div></section>
  <section class="cartao limite-formulario afastar-topo-maior" aria-labelledby="titulo-minha-receita">
    <h2 id="titulo-minha-receita">Adicionar minha receita</h2>
    <form id="formulario-minha-receita" novalidate>
      <div class="duas-colunas">
        <div class="campo"><label for="nome-receita">Nome da receita</label><input id="nome-receita" type="text" placeholder="Ex.: Bolo de cenoura" autocomplete="off" aria-describedby="erro-receita"></div>
        <div class="campo"><label for="tempo-receita">Tempo de preparo (minutos)</label><input id="tempo-receita" type="number" min="1" max="600" placeholder="30"></div>
      </div>
      <div class="campo"><label for="ingredientes-receita">Ingredientes (separados por vírgula)</label><input id="ingredientes-receita" type="text" placeholder="Ex.: Cenoura, Ovos, Farinha" autocomplete="off"></div>
      <div class="campo"><label for="passos-receita">Modo de preparo (um passo por linha)</label><textarea id="passos-receita" rows="4" placeholder="Bata tudo no liquidificador."></textarea><span class="erro" id="erro-receita" role="alert"></span></div>
      <button class="botao botao-primario botao-pequeno" type="submit">Salvar receita</button>
    </form>
    <ul class="pilha afastar-topo" id="minhas-receitas"></ul>
  </section>
  <div class="colunas afastar-topo-maior">
    <section aria-labelledby="titulo-historico"><h2 id="titulo-historico">Receitas que já usei</h2><ul class="pilha" id="historico-receitas"></ul></section>
    <section aria-labelledby="titulo-uso"><h2 id="titulo-uso">Quanto usei de cada ingrediente</h2><ul class="pilha" id="uso-ingredientes"></ul></section>
  </div>
</main>
<script src="js/nucleo.js"></script><script src="js/receitas.js"></script>
</body>
</html>
